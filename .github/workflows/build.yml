name: Build Android APK
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
    - name: Run Build
      run: |
        cd android-client
        gradle assembleDebug > build_log.txt 2>&1 || true
        cat build_log.txt
    - name: Upload Log if Failed
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android-client/build_log.txt
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: radar-family-app
        path: android-client/app/build/outputs/apk/debug/app-debug.apk
